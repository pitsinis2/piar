<!DOCTYPE html>
<html>
<head>
    <title>Google Drive Connection</title>
    <style>
        body { font-family: system-ui; padding: 2em; text-align: center; background: #f5f5f5; }
        .message { background: white; padding: 2em; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .spinner { border: 4px solid #e0e0e0; border-top: 4px solid #2196F3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 1em auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #d32f2f; }
        .success { color: #388e3c; }
    </style>
</head>
<body>
    <div class="message">
        <div id="status">
            <div class="spinner"></div>
            <p>Connecting to Google Drive...</p>
        </div>
    </div>

    <script>
        async function handleCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');

            const statusDiv = document.getElementById('status');

            if (error) {
                statusDiv.innerHTML = `<p class="error">❌ Authorization denied: ${error}</p><p style="font-size: 0.9em; color: #666;">You can close this window.</p>`;
                setTimeout(() => window.close(), 3000);
                return;
            }

            if (!code) {
                statusDiv.innerHTML = `<p class="error">❌ No authorization code received</p><p style="font-size: 0.9em; color: #666;">You can close this window.</p>`;
                setTimeout(() => window.close(), 3000);
                return;
            }

            try {
                // Exchange code for token via Edge Function
                const response = await fetch('/functions/v1/google-oauth-callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, state })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Token exchange failed');
                }

                const { accessToken, expiresIn } = await response.json();

                // Store token in parent window's sessionStorage
                if (window.opener && !window.opener.closed) {
                    const orgCode = sessionStorage.getItem('google_auth_org_code') || 'unknown';
                    window.opener.sessionStorage.setItem(`google_token_${orgCode}`, JSON.stringify({
                        accessToken,
                        expiresIn,
                        obtainedAt: new Date().toISOString()
                    }));

                    // Notify parent window
                    window.opener.dispatchEvent(new StorageEvent('storage', {
                        key: `google_token_${orgCode}`,
                        newValue: JSON.stringify({ accessToken, expiresIn })
                    }));

                    statusDiv.innerHTML = `<p class="success">✓ Connected successfully!</p><p style="font-size: 0.9em; color: #666;">Closing window...</p>`;
                    setTimeout(() => window.close(), 1500);
                } else {
                    statusDiv.innerHTML = `<p class="success">✓ Connected!</p><p style="font-size: 0.9em; color: #666;">You can close this window and retry the backup.</p>`;
                }

            } catch (error) {
                console.error('Callback error:', error);
                statusDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p><p style="font-size: 0.9em; color: #666;">You can close this window and try again.</p>`;
            }
        }

        // Save org code before opening window (called from parent)
        if (window.opener) {
            const orgCode = window.opener.currentOrgCode;
            if (orgCode) {
                sessionStorage.setItem('google_auth_org_code', orgCode);
            }
        }

        // Handle callback
        handleCallback();
    </script>
</body>
</html>
